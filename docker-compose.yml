services:
  monolithbot:
    image: ghcr.io/stevengann/monolithbot:latest
    container_name: monolithbot
    restart: unless-stopped
    # Mount config.json, logs, and data directory from host
    # data/ holds user_registry.json (registrations) and admin-login.json (Admin UI)
    volumes:
      - /mnt/App-Storage/Container-Data/monolithbot/config/config.json:/app/config.json:ro
      - /mnt/App-Storage/Container-Data/monolithbot/logs:/app/logs
      - /mnt/App-Storage/Container-Data/monolithbot/data:/app/data
    # Admin UI (when admin_ui.enabled in config). Use host 0.0.0.0 in config to reach from host.
    ports:
      - "5050:5050"
    # Optional: Override specific settings via environment variables
    # (Environment variables take precedence over config.json)
    # Uncomment and set these if you want to override config.json values:
    # environment:
    #   - DISCORD_TOKEN=${DISCORD_TOKEN}
    #   - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    #   - JELLYFIN_URL=${JELLYFIN_URL}
    #   - LOG_DIRECTORY=/app/logs
    #   - LOG_LEVEL=INFO
    #   - ADMIN_UI_ENABLED=true
    #   - ADMIN_UI_PORT=5050
    #   - ADMIN_UI_HOST=0.0.0.0

    # Optional: Connect to the same network as Jellyfin
    # networks:
    #   - jellyfin_network

    # Optional: If Jellyfin is on a custom network
    # networks:
    #   jellyfin_network:
    #     external: true
networks: {}
